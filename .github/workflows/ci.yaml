name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # Every default-branch commit may later be tagged for release.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Check formatting and Clippy
        run: just lint

      - name: Run tests
        run: just test

      - name: Test release helper
        run: just test-release

  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.51.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2

      - name: Lint and render all chart values
        run: just helm

  container:
    name: Test container lifecycle
    needs: [checks, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sqlite-web-starter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test startup, writes, shutdown, and restore
        run: bash smoke.sh sqlite-web-starter:ci

      # Publish the exact image that passed smoke testing, without rebuilding it.
      - name: Save tested image
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch &&
          vars.AWS_ACCOUNT_ID != ''
        run: docker save --output "$RUNNER_TEMP/image.tar" sqlite-web-starter:ci

      - name: Upload tested image
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch &&
          vars.AWS_ACCOUNT_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ github.sha }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  docker-build:
    name: Publish commit image
    needs: [checks, helm, container]
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch &&
      vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'sqlite-web-starter' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ECR_ROLE_NAME || 'github-ecr-push' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check for existing commit image
        id: image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          response=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$SOURCE_SHA" --output json)
          if jq -e '.images | length == 1' <<< "$response" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif jq -e '.failures | length == 1 and .[0].failureCode == "ImageNotFound"' <<< "$response" >/dev/null; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not determine whether the commit image exists: $response"
            exit 1
          fi

      - name: Download tested image
        if: steps.image.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: container-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Push tested commit image
        if: steps.image.outputs.exists == 'false'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          image="$REGISTRY/$ECR_REPOSITORY:$SOURCE_SHA"
          docker tag sqlite-web-starter:ci "$image"
          docker push "$image"
