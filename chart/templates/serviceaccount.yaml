{{- if and .Values.serviceAccount.create (not .Values.serviceAccountName) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sqlite-web-starter.serviceAccountName" . }}
  labels:
    {{- include "sqlite-web-starter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
